name: social-network-homework-6

x-api: &api
  image: localhost/social-network-homework-6-api:local
  build:
    context: ../..
    dockerfile: Dockerfile
  environment:
    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_HTTP_PORTS: "8080"
    ConnectionStrings__Postgres: Host=postgres;Database=app_feed
    ConnectionStrings__RabbitMq: "amqp://feed:${RABBITMQ_PASSWORD_HW6:?Set a URL-safe RABBITMQ_PASSWORD_HW6}@rabbitmq:5672/"
    DataProtection__KeyPath: /home/app/.aspnet/DataProtection-Keys
    PGUSER: ${POSTGRES_USER:-appuser}
    PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  volumes:
    - api_keys:/home/app
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: app_feed
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../sql/001_create_users.sql:/docker-entrypoint-initdb.d/001_create_users.sql:ro
      - ../sql/003_posts_and_friends.sql:/docker-entrypoint-initdb.d/003_posts_and_friends.sql:ro
      - ../sql/004_feed_delivery.sql:/docker-entrypoint-initdb.d/004_feed_delivery.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 15

  rabbitmq:
    image: docker.io/library/rabbitmq:4.2-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: feed
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD_HW6:?Set RABBITMQ_PASSWORD_HW6 in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT_HW6:-15676}:15672"
    healthcheck:
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *api
    ports:
      - "127.0.0.1:${API_HOST_PORT_HW6:-5086}:8080"

  api-replica:
    <<: *api
    ports:
      - "127.0.0.1:${API_REPLICA_HOST_PORT_HW6:-5087}:8080"

volumes:
  postgres_data:
  rabbitmq_data:
  api_keys:
