name: social-network-homework-5

x-postgres: &postgres
  image: docker.io/library/postgres:17
  healthcheck:
    test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
    interval: 5s
    timeout: 5s
    retries: 15

x-shard-environment: &shard-environment
  POSTGRES_USER: ${POSTGRES_USER:-appuser}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: dialogs

services:
  postgres:
    <<: *postgres
    environment:
      <<: *shard-environment
      POSTGRES_DB: ${POSTGRES_DB_HW5:-app_dialogs}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../sql/001_create_users.sql:/docker-entrypoint-initdb.d/001_create_users.sql:ro
      - ../sql/003_posts_and_friends.sql:/docker-entrypoint-initdb.d/003_posts_and_friends.sql:ro
      - ./dialog-routes.sql:/docker-entrypoint-initdb.d/004_dialog_routes.sql:ro
      - ./activate-third-shard.sql:/homework-5/activate-third-shard.sql:ro

  dialog-a:
    <<: *postgres
    environment: *shard-environment
    volumes:
      - dialog_a_data:/var/lib/postgresql/data
      - ./dialog-messages.sql:/docker-entrypoint-initdb.d/001_dialog_messages.sql:ro

  dialog-b:
    <<: *postgres
    environment: *shard-environment
    volumes:
      - dialog_b_data:/var/lib/postgresql/data
      - ./dialog-messages.sql:/docker-entrypoint-initdb.d/001_dialog_messages.sql:ro

  dialog-c:
    <<: *postgres
    environment: *shard-environment
    volumes:
      - dialog_c_data:/var/lib/postgresql/data
      - ./dialog-messages.sql:/docker-entrypoint-initdb.d/001_dialog_messages.sql:ro

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Postgres: "Host=postgres;Database=${POSTGRES_DB_HW5:-app_dialogs}"
      DialogShards__dialog-a: "Host=dialog-a;Database=dialogs;Timeout=5;Command Timeout=10"
      DialogShards__dialog-b: "Host=dialog-b;Database=dialogs;Timeout=5;Command Timeout=10"
      DialogShards__dialog-c: "Host=dialog-c;Database=dialogs;Timeout=5;Command Timeout=10"
      PGUSER: ${POSTGRES_USER:-appuser}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${API_HOST_PORT_HW5:-5085}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      dialog-a:
        condition: service_healthy
      dialog-b:
        condition: service_healthy
      dialog-c:
        condition: service_healthy

volumes:
  postgres_data:
  dialog_a_data:
  dialog_b_data:
  dialog_c_data:
